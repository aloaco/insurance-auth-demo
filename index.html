<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prior Authorization</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Dummy data for auth records
    const initialAuthRecords = [
      { id: 1, patientName: 'Sarah Mitchell', insurance: 'UnitedHealthcare', status: 'Approved', lastUpdated: '2026-01-02', procedure: 'MRI Lumbar Spine' },
      { id: 2, patientName: 'James Rodriguez', insurance: 'Aetna', status: 'Pending', lastUpdated: '2026-01-01', procedure: 'CT Abdomen' },
      {
        id: 3,
        patientName: 'Emily Chen',
        insurance: 'Blue Cross',
        status: 'Needs Peer-to-Peer',
        lastUpdated: '2025-12-30',
        procedure: 'Humira Injection',
        peerToPeer: {
          scheduledDate: '2026-01-05',
          scheduledTime: '2:30 PM EST',
          reviewerName: 'Dr. Michael Roberts',
          reviewerSpecialty: 'Rheumatology',
          phoneNumber: '1-800-555-5555',
          caseNumber: 'P2P-2025-78432',
          talkingPoints: [
            'Patient has failed methotrexate therapy for 6+ months with documented side effects',
            'Current disease activity score (DAS28) of 5.1 indicates high disease activity',
            'Joint erosions visible on recent X-rays indicate progressive disease',
            'Humira is FDA-approved for moderate-to-severe RA after inadequate response to DMARDs.',
            'Early biologic intervention shown to prevent irreversible joint damage',
            'Patient has no contraindications to TNF-inhibitor therapy'
          ],
          clinicalNotes: 'Patient diagnosed with RA 2 years ago. Failed conventional DMARDs. Significant morning stiffness (>1 hour), elevated CRP and ESR.'
        }
      },
      {
        id: 4,
        patientName: 'Robert Kim',
        insurance: 'Medicare',
        status: 'Denied',
        lastUpdated: '2025-12-28',
        procedure: 'Spinal Fusion Surgery',
        denial: {
          denialCode: 'MED-2025-11234',
          denialReason: 'Documentation does not demonstrate failure of conservative treatment for minimum 6-week period as required by LCD 37848.',
          appealDeadline: '2026-01-28',
          requiredForResubmission: [
            'Physical therapy progress notes showing 6+ weeks of treatment',
            'Documentation of failed oral medication trial (NSAIDs, muscle relaxants)',
            'Updated functional assessment scores (ODI or similar)',
            'Confirmation of epidural steroid injection trial'
          ],
          phoneNumber: '1-800-MEDICARE',
          appealFaxNumber: '1-800-555-5555',
          disputeScript: [
            'Reference case number MED-2025-11234 for spinal fusion prior authorization',
            'Patient has completed 8 weeks of physical therapy with documented lack of improvement',
            'Request expedited review based on progressive neurological symptoms',
            'Ask for specific documentation requirements for appeal submission'
          ]
        }
      }
    ];

    const documentQuestions = [
      { field: 'prior_treatment', question: 'What conservative treatments has the patient tried? Please include duration and outcomes.' },
      { field: 'diagnosis_duration', question: 'How long has the patient had this diagnosis?' },
      { field: 'procedure_details', question: 'Please specify the exact procedure, including approach, dosage if applicable, and frequency.' }
    ];

    const StatusBadge = ({ status }) => {
      const config = {
        Approved: { color: '#22c55e', label: 'Approved' },
        Pending: { color: '#eab308', label: 'Pending' },
        'Needs Peer-to-Peer': { color: '#7c3aed', label: 'Peer-to-Peer' },
        Denied: { color: '#dc2626', label: 'Denied' }
      };
      const { color, label } = config[status] || config.Pending;

      return (
        <span style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: '8px',
          fontSize: '14px',
          fontWeight: '500',
          color: '#1a1a1a'
        }}>
          <span style={{
            width: '8px',
            height: '8px',
            borderRadius: '50%',
            backgroundColor: color
          }} />
          {label}
        </span>
      );
    };

    const LoadingSpinner = () => (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '16px' }}>
        <div style={{
          width: '40px',
          height: '40px',
          border: '2px solid #e5e5e5',
          borderTop: '2px solid #1a1a1a',
          borderRadius: '50%',
          animation: 'spin 1s linear infinite'
        }} />
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );

    const ChatMessage = ({ message, isSystem }) => (
      <div style={{
        display: 'flex',
        justifyContent: isSystem ? 'flex-start' : 'flex-end',
        marginBottom: '16px',
        animation: 'fadeIn 0.3s ease'
      }}>
        <style>{`@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }`}</style>
        <div style={{
          maxWidth: '85%',
          padding: '14px 18px',
          borderRadius: isSystem ? '4px 20px 20px 20px' : '20px 20px 4px 20px',
          backgroundColor: isSystem ? '#f5f5f5' : '#1a1a1a',
          color: isSystem ? '#1a1a1a' : 'white',
          fontSize: '15px',
          lineHeight: '1.5'
        }}>
          {message}
        </div>
      </div>
    );

    const TypingIndicator = () => (
      <div style={{
        display: 'flex',
        justifyContent: 'flex-start',
        marginBottom: '16px'
      }}>
        <div style={{
          padding: '14px 18px',
          borderRadius: '4px 20px 20px 20px',
          backgroundColor: '#f5f5f5',
          display: 'flex',
          alignItems: 'center',
          gap: '5px'
        }}>
          <style>{`
        @keyframes bounce {
          0%, 60%, 100% { transform: translateY(0); }
          30% { transform: translateY(-4px); }
        }
      `}</style>
          {[0, 1, 2].map(i => (
            <div key={i} style={{
              width: '7px',
              height: '7px',
              borderRadius: '50%',
              backgroundColor: '#1a1a1a',
              animation: 'bounce 1.4s ease-in-out infinite',
              animationDelay: `${i * 0.2}s`
            }} />
          ))}
        </div>
      </div>
    );

    const DocumentSection = ({ title, content, placeholder, isEditable, isFilled, isHighlighted, isCurrentField }) => {
      return (
        <div style={{
          marginBottom: '20px',
          padding: '16px 20px',
          borderRadius: '12px',
          backgroundColor: isCurrentField ? '#f3e8ff' : isFilled ? '#f0fdf4' : isEditable ? '#fef2f2' : '#fafafa',
          border: isCurrentField ? '2px solid #7c3aed' : isFilled ? '2px solid #22c55e' : isEditable ? '2px solid #fca5a5' : '1px solid #e5e5e5',
          transition: 'all 0.3s ease'
        }}>
          <div style={{
            fontSize: '11px',
            fontWeight: '600',
            color: isCurrentField ? '#7c3aed' : isFilled ? '#166534' : isEditable ? '#dc2626' : '#666',
            marginBottom: '8px',
            letterSpacing: '0.5px',
            textTransform: 'uppercase',
            display: 'flex',
            alignItems: 'center',
            gap: '8px'
          }}>
            {title}
            {isFilled && <span style={{ fontSize: '10px', fontWeight: '500', color: '#22c55e' }}>✓ Complete</span>}
            {isCurrentField && !isFilled && <span style={{ fontSize: '10px', backgroundColor: '#7c3aed', color: 'white', padding: '2px 8px', borderRadius: '100px' }}>Current</span>}
            {isEditable && !isFilled && !isCurrentField && <span style={{ fontSize: '10px', fontWeight: '500', color: '#dc2626' }}>Required</span>}
          </div>
          <div style={{
            fontSize: '14px',
            lineHeight: '1.6',
            color: isFilled ? '#1a1a1a' : content ? '#1a1a1a' : '#999',
            whiteSpace: 'pre-wrap'
          }}>
            {content || placeholder || 'No content'}
          </div>
        </div>
      );
    };

    function PriorAuthDemo() {
      const [currentView, setCurrentView] = useState('dashboard');
      const [authRecords, setAuthRecords] = useState(initialAuthRecords);
      const [selectedRecord, setSelectedRecord] = useState(null);

      const [step, setStep] = useState(1);
      const [patientName, setPatientName] = useState('');
      const [selectedInsurance, setSelectedInsurance] = useState('');
      const [uploadedFile, setUploadedFile] = useState(null);
      const [chatHistory, setChatHistory] = useState([]);
      const [userInput, setUserInput] = useState('');
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [documentData, setDocumentData] = useState({
        prior_treatment: null,
        diagnosis_duration: null,
        procedure_details: null
      });
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [highlightedField, setHighlightedField] = useState(null);
      const [expandedSection, setExpandedSection] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(null);
      const [isTyping, setIsTyping] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [analysisStage, setAnalysisStage] = useState('');

      const chatEndRef = useRef(null);
      const docScrollRef = useRef(null);
      const fieldRefs = {
        prior_treatment: useRef(null),
        diagnosis_duration: useRef(null),
        procedure_details: useRef(null)
      };

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatHistory, isTyping]);

      useEffect(() => {
        const currentField = getCurrentField();
        if (currentField && fieldRefs[currentField]?.current && docScrollRef.current) {
          const container = docScrollRef.current;
          const element = fieldRefs[currentField].current;
          const scrollTop = element.offsetTop - container.offsetTop - 100;
          container.scrollTo({ top: scrollTop, behavior: 'smooth' });
        }
      }, [currentQuestionIndex]);

      const simulateFileUpload = (fileName = 'clinical_notes.pdf', fileSize = '2.4 MB') => {
        setUploadProgress('uploading');
        setTimeout(() => {
          setUploadProgress('processing');
          setTimeout(() => {
            setUploadProgress(null);
            setUploadedFile({ name: fileName, size: fileSize });
          }, 2000);
        }, 1500);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files[0];
        if (file) {
          simulateFileUpload(file.name, `${(file.size / 1024 / 1024).toFixed(1)} MB`);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleAnalysis = () => {
        setStep(3);
        setIsAnalyzing(true);
        const stages = [
          'Extracting clinical data...',
          `Reviewing ${selectedInsurance} requirements...`,
          'Identifying documentation gaps...',
          'Preparing authorization checklist...'
        ];
        let stageIndex = 0;
        setAnalysisStage(stages[0]);
        const stageInterval = setInterval(() => {
          stageIndex++;
          if (stageIndex < stages.length) {
            setAnalysisStage(stages[stageIndex]);
          }
        }, 1500);
        setTimeout(() => {
          clearInterval(stageInterval);
          setIsAnalyzing(false);
          setAnalysisStage('');
          setChatHistory([{ isSystem: true, message: documentQuestions[0].question }]);
        }, 6500);
      };

      const handleChatSubmit = () => {
        if (!userInput.trim() || isTyping) return;
        const userMessage = userInput.trim();
        setChatHistory(prev => [...prev, { isSystem: false, message: userMessage }]);
        setUserInput('');
        setIsTyping(true);
        const typingDelay = 1000 + Math.random() * 1000;
        setTimeout(() => {
          const currentField = documentQuestions[currentQuestionIndex].field;
          setDocumentData(prev => ({ ...prev, [currentField]: userMessage }));
          setHighlightedField(currentField);
          setTimeout(() => setHighlightedField(null), 2000);
          setIsTyping(false);
          if (currentQuestionIndex < documentQuestions.length - 1) {
            setChatHistory(prev => [...prev, {
              isSystem: true,
              message: `Got it. ${documentQuestions[currentQuestionIndex + 1].question}`
            }]);
            setCurrentQuestionIndex(prev => prev + 1);
          } else {
            setChatHistory(prev => [...prev, {
              isSystem: true,
              message: "All required fields are now complete. Your documentation is ready for review."
            }]);
          }
        }, typingDelay);
      };

      const allIssuesResolved = () => Object.values(documentData).every(v => v !== null);

      const getCurrentField = () => {
        if (currentQuestionIndex < documentQuestions.length) {
          return documentQuestions[currentQuestionIndex].field;
        }
        return null;
      };

      const generatedOutputs = {
        summary: `Prior Authorization Request Summary\n\nPatient: ${patientName || 'John Smith'}\nInsurance: ${selectedInsurance}\nProcedure: Lumbar Epidural Steroid Injection\nDate of Service: 01/02/2026\nProvider: Dr. Sarah Chen, MD\n\nClinical Indication: Lumbar radiculopathy secondary to L4-L5 disc herniation with documented failure of conservative management.`,
        cptCodes: [
          { code: '62322', description: 'Injection(s), lumbar epidural, diagnostic or therapeutic' },
          { code: '77003', description: 'Fluoroscopic guidance and localization' },
          { code: '99214', description: 'Office visit, established patient' }
        ],
        icdCodes: [
          { code: 'M54.16', description: 'Radiculopathy, lumbar region' },
          { code: 'M51.16', description: 'Intervertebral disc disorders with radiculopathy, lumbar region' },
          { code: 'M47.816', description: 'Spondylosis without myelopathy, lumbar region' }
        ],
        narrative: `Medical Necessity Statement\n\nThis prior authorization is submitted for ${patientName || 'the patient'} who requires a lumbar epidural steroid injection based on documented clinical findings.\n\nThe patient has demonstrated inadequate response to conservative management including ${documentData.prior_treatment || 'physical therapy and pharmacological interventions'}. Diagnosis duration: ${documentData.diagnosis_duration || 'documented in clinical notes'}.\n\nCurrent symptoms significantly impact daily functioning and quality of life. The requested intervention (${documentData.procedure_details || 'epidural steroid injection'}) is supported by peer-reviewed literature and aligns with current clinical practice guidelines.`,
        talkingPoints: [
          'Patient has documented failure of conservative treatment over adequate duration',
          'Imaging confirms structural pathology correlating with clinical symptoms',
          'Procedure is medically necessary and appropriate for diagnosis',
          'Treatment aligns with current clinical guidelines and LCD requirements',
          'No contraindications to proposed intervention',
          'Expected outcome: Pain reduction and functional improvement'
        ]
      };

      const handleSubmit = () => {
        setIsSubmitting(true);
        setTimeout(() => {
          const newRecord = {
            id: authRecords.length + 1,
            patientName: patientName || 'John Smith',
            insurance: selectedInsurance,
            status: 'Pending',
            lastUpdated: new Date().toISOString().split('T')[0],
            procedure: 'Lumbar Epidural Steroid Injection'
          };
          setAuthRecords(prev => [newRecord, ...prev]);
          setIsSubmitting(false);
          setCurrentView('dashboard');
          setStep(1);
          setPatientName('');
          setSelectedInsurance('');
          setUploadedFile(null);
          setChatHistory([]);
          setCurrentQuestionIndex(0);
          setDocumentData({ prior_treatment: null, diagnosis_duration: null, procedure_details: null });
        }, 2500);
      };

      const startNewAuth = () => {
        setCurrentView('newAuth');
        setStep(1);
        setPatientName('');
        setSelectedInsurance('');
        setUploadedFile(null);
        setChatHistory([]);
        setCurrentQuestionIndex(0);
        setDocumentData({ prior_treatment: null, diagnosis_duration: null, procedure_details: null });
      };

      if (currentView === 'dashboard') {
        return (
          <div style={{ minHeight: '100vh', backgroundColor: '#fafafa', fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif" }}>
            <style>{`@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');`}</style>
            <header style={{ backgroundColor: 'white', borderBottom: '1px solid #e5e5e5', padding: '20px 32px', display: 'flex', justifyContent: 'flex-end', alignItems: 'center' }}>
              <button onClick={startNewAuth} style={{ backgroundColor: '#1a1a1a', color: 'white', border: 'none', padding: '14px 28px', borderRadius: '100px', fontWeight: '500', fontSize: '15px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{ fontSize: '18px', lineHeight: 1 }}>+</span> New Authorization
              </button>
            </header>
            <main style={{ padding: '40px 32px', maxWidth: '1200px', margin: '0 auto' }}>
              <div style={{ marginBottom: '40px' }}>
                <h1 style={{ margin: '0 0 8px 0', fontSize: '36px', fontWeight: '500', color: '#1a1a1a', fontFamily: "'Playfair Display', serif" }}>Prior Authorizations</h1>
                <p style={{ margin: 0, color: '#666', fontSize: '16px' }}>Manage and track your authorization requests</p>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '40px' }}>
                {[
                  { label: 'Total Requests', value: authRecords.length },
                  { label: 'Approved', value: authRecords.filter(r => r.status === 'Approved').length },
                  { label: 'Pending', value: authRecords.filter(r => r.status === 'Pending').length },
                  { label: 'Action Needed', value: authRecords.filter(r => r.status === 'Needs Peer-to-Peer' || r.status === 'Denied').length }
                ].map((stat, i) => (
                  <div key={i} style={{ backgroundColor: 'white', borderRadius: '16px', padding: '24px', border: '1px solid #e5e5e5' }}>
                    <p style={{ margin: '0 0 8px 0', fontSize: '14px', color: '#666' }}>{stat.label}</p>
                    <p style={{ margin: 0, fontSize: '32px', fontWeight: '600', color: '#1a1a1a', fontFamily: "'Playfair Display', serif" }}>{stat.value}</p>
                  </div>
                ))}
              </div>
              <div style={{ backgroundColor: 'white', borderRadius: '16px', border: '1px solid #e5e5e5', overflow: 'hidden' }}>
                <div style={{ padding: '20px 24px', borderBottom: '1px solid #e5e5e5' }}>
                  <h2 style={{ margin: 0, fontSize: '18px', fontWeight: '600', color: '#1a1a1a' }}>Recent Requests</h2>
                </div>
                <div>
                  {authRecords.map((record, i) => {
                    const hasDetails = (record.status === 'Denied' && record.denial) || (record.status === 'Needs Peer-to-Peer' && record.peerToPeer);
                    return (
                      <div key={record.id} onClick={() => hasDetails && setSelectedRecord(record)} style={{ padding: '20px 24px', borderBottom: i < authRecords.length - 1 ? '1px solid #f0f0f0' : 'none', display: 'grid', gridTemplateColumns: '1fr 1.2fr 140px 24px', alignItems: 'center', gap: '16px', cursor: hasDetails ? 'pointer' : 'default', transition: 'background-color 0.15s ease', backgroundColor: 'white' }} onMouseEnter={(e) => hasDetails && (e.currentTarget.style.backgroundColor = '#fafafa')} onMouseLeave={(e) => e.currentTarget.style.backgroundColor = 'white'}>
                        <div>
                          <p style={{ margin: 0, fontWeight: '500', color: '#1a1a1a', fontSize: '15px' }}>{record.patientName}</p>
                          <p style={{ margin: '2px 0 0 0', color: '#999', fontSize: '13px' }}>{record.lastUpdated}</p>
                        </div>
                        <div>
                          <p style={{ margin: 0, color: '#1a1a1a', fontSize: '14px' }}>{record.procedure}</p>
                          <p style={{ margin: '2px 0 0 0', color: '#999', fontSize: '13px' }}>{record.insurance}</p>
                        </div>
                        <div><StatusBadge status={record.status} /></div>
                        <div style={{ color: '#ccc', fontSize: '18px', textAlign: 'right' }}>{hasDetails ? '→' : ''}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </main>

            {selectedRecord && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
                <div style={{ backgroundColor: 'white', borderRadius: '20px', width: '100%', maxWidth: '560px', maxHeight: '90vh', overflow: 'auto' }}>
                  <div style={{ padding: '24px', borderBottom: '1px solid #e5e5e5', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <h2 style={{ margin: '0 0 4px 0', fontSize: '22px', fontWeight: '600', color: '#1a1a1a', fontFamily: "'Playfair Display', serif" }}>{selectedRecord.patientName}</h2>
                      <p style={{ margin: 0, color: '#666', fontSize: '14px' }}>{selectedRecord.procedure} • {selectedRecord.insurance}</p>
                    </div>
                    <button onClick={() => setSelectedRecord(null)} style={{ backgroundColor: '#f5f5f5', border: 'none', width: '36px', height: '36px', borderRadius: '50%', cursor: 'pointer', fontSize: '20px', color: '#666', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
                  </div>

                  {selectedRecord.status === 'Denied' && selectedRecord.denial && (
                    <div>
                      <div style={{ backgroundColor: '#fef2f2', padding: '20px 24px', borderBottom: '1px solid #fecaca' }}>
                        <p style={{ margin: '0 0 8px 0', fontWeight: '600', color: '#dc2626', fontSize: '14px' }}>Denial Code: {selectedRecord.denial.denialCode}</p>
                        <p style={{ margin: 0, color: '#991b1b', fontSize: '15px', lineHeight: '1.6' }}>{selectedRecord.denial.denialReason}</p>
                        <p style={{ margin: '12px 0 0 0', color: '#dc2626', fontSize: '14px', fontWeight: '500' }}>Appeal Deadline: {selectedRecord.denial.appealDeadline}</p>
                      </div>
                      <div style={{ padding: '24px', borderBottom: '1px solid #e5e5e5' }}>
                        <h3 style={{ margin: '0 0 16px 0', fontSize: '11px', fontWeight: '600', color: '#666', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Required for Resubmission</h3>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                          {selectedRecord.denial.requiredForResubmission.map((item, i) => (
                            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: '12px' }}>
                              <span style={{ minWidth: '24px', height: '24px', borderRadius: '50%', backgroundColor: '#f5f5f5', color: '#666', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: '600' }}>{i + 1}</span>
                              <span style={{ fontSize: '15px', color: '#1a1a1a', lineHeight: '1.5' }}>{item}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div style={{ padding: '24px', backgroundColor: '#fafafa', borderBottom: '1px solid #e5e5e5' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px' }}>
                          <h3 style={{ margin: 0, fontSize: '11px', fontWeight: '600', color: '#666', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Dispute Call Script</h3>
                          <a href={`tel:${selectedRecord.denial.phoneNumber}`} style={{ backgroundColor: '#1a1a1a', color: 'white', padding: '10px 20px', borderRadius: '100px', textDecoration: 'none', fontWeight: '500', fontSize: '14px' }}>{selectedRecord.denial.phoneNumber}</a>
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                          {selectedRecord.denial.disputeScript.map((point, i) => (
                            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '14px 16px', backgroundColor: 'white', borderRadius: '12px', border: '1px solid #e5e5e5' }}>
                              <span style={{ color: '#1a1a1a', fontWeight: '600', fontSize: '14px' }}>{i + 1}.</span>
                              <span style={{ fontSize: '14px', color: '#1a1a1a', lineHeight: '1.5' }}>{point}</span>
                            </div>
                          ))}
                        </div>
                        <p style={{ margin: '16px 0 0 0', fontSize: '13px', color: '#666' }}>Fax additional documentation: {selectedRecord.denial.appealFaxNumber}</p>
                      </div>
                      <div style={{ padding: '24px', display: 'flex', gap: '12px' }}>

      return (
        <div style={{ height: step === 3 && !allIssuesResolved() ? '100vh' : 'auto', minHeight: step === 3 && !allIssuesResolved() ? 'auto' : '100vh', overflow: step === 3 && !allIssuesResolved() ? 'hidden' : 'auto', backgroundColor: '#fafafa', fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif", display: 'flex', flexDirection: 'column' }}>

                      <div>
                        <p style={{ margin: 0, fontWeight: '500', color: '#1a1a1a', fontSize: '16px' }}>{insurance}</p>
                        <p style={{ margin: '4px 0 0 0', fontSize: '13px', color: '#666' }}>
                          {insurance === 'Medicare' && 'Federal health insurance'}
                          {insurance === 'UnitedHealthcare' && 'Commercial payer'}
                          {insurance === 'Aetna' && 'Commercial payer'}
                          {insurance === 'Blue Cross' && 'Regional BCBS plan'}

                      </div>
                      <div style={{ width: '24px', height: '24px', borderRadius: '50%', border: selectedInsurance === insurance ? '2px solid #1a1a1a' : '2px solid #e5e5e5', backgroundColor: selectedInsurance === insurance ? '#1a1a1a' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

                <div style={{ display: 'flex', gap: '12px' }}>

                        <p style={{ margin: 0, fontSize: '14px', color: '#666' }}>{patientName || 'John Smith'} • DOS: 01/02/2026 • Provider: Dr. Sarah Chen, MD</p>
                      </div>
                      <DocumentSection title="Chief Complaint" content="Patient presents with chronic lower back pain radiating to left leg, worsening over the past 3 months." />

                    </div>

                  <div style={{ padding: '20px 24px', borderTop: '1px solid #e5e5e5', backgroundColor: 'white', display: 'flex', justifyContent: 'center', gap: '24px', flexShrink: 0 }}>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}><div style={{ width: '12px', height: '12px', backgroundColor: '#f0fdf4', borderRadius: '4px', border: '2px solid #22c55e' }} /><span style={{ fontSize: '13px', color: '#666' }}>Complete</span></div>

            {step === 3 && allIssuesResolved() && (

                  <div>

                    <DocumentSection title="History of Present Illness" content="45-year-old male with progressive lumbar radiculopathy. Pain rated 7/10, aggravated by prolonged sitting and standing. Reports numbness and tingling in L5 distribution." />
                    <DocumentSection title="Prior Conservative Treatment" content={documentData.prior_treatment} isFilled={true} isEditable={true} />
                    <DocumentSection title="Physical Examination" content="• Lumbar spine: Tenderness at L4-L5\n• Neurological: Decreased sensation left lateral foot\n• Motor: 4/5 strength left ankle dorsiflexion\n• Positive straight leg raise at 45 degrees" />
                    <DocumentSection title="Imaging" content="MRI lumbar spine (01/02/2026): L4-L5 disc herniation with moderate neural foraminal stenosis." />
                    <DocumentSection title="Assessment" content="1. Lumbar radiculopathy secondary to L4-L5 disc herniation\n2. Neural foraminal stenosis" />
                    <DocumentSection title="Diagnosis Duration" content={documentData.diagnosis_duration} isFilled={true} isEditable={true} />
                    <DocumentSection title="Plan" content="Recommend lumbar epidural steroid injection for pain management." />
                    <DocumentSection title="Procedure Specifications" content={documentData.procedure_details} isFilled={true} isEditable={true} />
                  </div>
                </div>
                {[
                  { title: 'Prior Authorization Summary', content: generatedOutputs.summary, type: 'text' },
                  { title: 'CPT Code Recommendations', content: generatedOutputs.cptCodes, type: 'codes' },
                  { title: 'ICD-10 Code Recommendations', content: generatedOutputs.icdCodes, type: 'codes' },
                  { title: 'Medical Necessity Narrative', content: generatedOutputs.narrative, type: 'text' },
                  { title: 'Peer-to-Peer Talking Points', content: generatedOutputs.talkingPoints, type: 'bullets', expandable: true }
                ].map((section, i) => (
                  <div key={i} style={{ backgroundColor: 'white', borderRadius: '16px', border: '1px solid #e5e5e5', overflow: 'hidden' }}>
                    <button onClick={() => section.expandable && setExpandedSection(expandedSection === i ? null : i)} style={{ width: '100%', padding: '18px 24px', backgroundColor: '#fafafa', border: 'none', borderBottom: section.expandable && expandedSection !== i ? 'none' : '1px solid #e5e5e5', textAlign: 'left', cursor: section.expandable ? 'pointer' : 'default', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span style={{ fontWeight: '600', color: '#1a1a1a', fontSize: '15px' }}>{section.title}</span>
                      {section.expandable && <span style={{ color: '#666', fontSize: '12px' }}>{expandedSection === i ? '▾' : '▸'}</span>}
                    </button>
                    {(!section.expandable || expandedSection === i) && (
                      <div style={{ padding: '20px 24px' }}>
                        {section.type === 'text' && <pre style={{ margin: 0, fontFamily: "'Inter', sans-serif", fontSize: '14px', lineHeight: '1.7', color: '#1a1a1a', whiteSpace: 'pre-wrap' }}>{section.content}</pre>}
                        {section.type === 'codes' && (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                            {section.content.map((code, j) => (
                              <div key={j} style={{ display: 'flex', alignItems: 'center', gap: '16px', padding: '14px 16px', backgroundColor: '#fafafa', borderRadius: '12px' }}>
                                <code style={{ fontFamily: 'monospace', fontSize: '14px', fontWeight: '600', color: '#1a1a1a', backgroundColor: 'white', padding: '6px 12px', borderRadius: '8px', border: '1px solid #e5e5e5' }}>{code.code}</code>
                                <span style={{ fontSize: '14px', color: '#666' }}>{code.description}</span>
                              </div>
                            ))}
                          </div>
                        )}
                        {section.type === 'bullets' && (
                          <ul style={{ margin: 0, paddingLeft: '0', listStyle: 'none' }}>
                            {section.content.map((point, j) => (
                              <li key={j} style={{ fontSize: '14px', color: '#1a1a1a', marginBottom: '12px', lineHeight: '1.6', padding: '14px 16px', backgroundColor: '#fafafa', borderRadius: '12px', display: 'flex', alignItems: 'flex-start', gap: '12px' }}>
                                <span style={{ minWidth: '22px', height: '22px', borderRadius: '50%', backgroundColor: '#f0fdf4', color: '#22c55e', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: '600', flexShrink: 0 }}>✓</span>
                                {point}
                              </li>
                            ))}
                          </ul>
                        )}
                      </div>
                    )}
                  </div>
                ))}
                <button onClick={handleSubmit} disabled={isSubmitting} style={{ width: '100%', backgroundColor: isSubmitting ? '#666' : '#1a1a1a', color: 'white', border: 'none', padding: '18px 24px', borderRadius: '100px', fontWeight: '500', fontSize: '16px', cursor: isSubmitting ? 'not-allowed' : 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                  {isSubmitting && <div style={{ width: '18px', height: '18px', border: '2px solid rgba(255,255,255,0.3)', borderTop: '2px solid white', borderRadius: '50%', animation: 'spin 1s linear infinite' }} />}
                  {isSubmitting ? 'Submitting...' : 'Submit Prior Authorization'}
                </button>
                <p style={{ textAlign: 'center', color: '#666', fontSize: '14px', margin: 0 }}>{isSubmitting ? 'Securely transmitting to ' + selectedInsurance + '...' : 'By submitting, this request will be sent to ' + selectedInsurance + ' for review'}</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PriorAuthDemo />);
  </script>
</body>

</html>
